version: "3.8"

services:
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: pubsub-emulator
    ports:
      - "8085:8085"
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=gcp-rf-telemetry

  telemetry-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telemetry-agent
    ports:
      - "8080:8080"
    environment:
      - GCP_PROJECT_ID=gcp-rf-telemetry
      - PUBSUB_TOPIC_ID=rf-telemetry-stream
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
    depends_on:
      - pubsub-emulator
    restart: unless-stopped
